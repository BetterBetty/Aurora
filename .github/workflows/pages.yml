name: Deploy Aurora
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Version tag or commit to publish (empty = main)'
        required: false
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check sw.js
      - name: Prepare public files and version stamp
        run: |
          mkdir -p dist
          cp index.html styles.css app.js manifest.json sw.js dist/
          SHA=$(git rev-parse HEAD)
          sed -i "s/aurora-mvp-v1/aurora-$SHA/g" dist/sw.js
          printf '{"commit":"%s","run":"%s"}\n' "$SHA" "$GITHUB_RUN_ID" > dist/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
